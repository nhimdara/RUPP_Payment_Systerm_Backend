spring.application.name=RUPP_Payment_Systerm_Backend_Test

# In-memory H2 database for isolated, fast QA and integration tests
spring.datasource.url=jdbc:h2:mem:rupp_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Disable sql init during tests
spring.sql.init.mode=never
