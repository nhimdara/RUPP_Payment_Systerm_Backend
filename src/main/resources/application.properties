spring.application.name=RUPP_Payment_Systerm_Backend

# ===================================================================
# DATABASE CONFIGURATION (Default: H2 File Database - No Password Needed)
# Data is saved in the local ./db/ folder across restarts.
# Web console available at: http://localhost:8081/h2-console
# ===================================================================
spring.datasource.url=jdbc:h2:file:./db/rupp_payment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Optional PostgreSQL database config (uncomment when needed) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/rupp_payment_db
# spring.datasource.username=postgres
# spring.datasource.password=Dara1234
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Web server
server.port=8081

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
